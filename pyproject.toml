[project]
name = "taxora"
version = "0.1.0"
description = "GBIF occurrence ingestion pipeline — a Temporal exercise app"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Taxora Contributors" },
]
requires-python = ">=3.12.0,<3.15.0"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "aiohttp>=3.13.1",
    "jinja2>=3.1.6",
    "sqlalchemy[asyncio]>=2.0.41",
    "alembic>=1.16.2",
    "temporalio>=1.30.0",
    "asyncpg>=0.30.0",
    "passlib[argon2]>=1.7.4",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "ruff>=0.14.8",
]
test = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
